draw_config:
  n_columns: 1
  split_gap: 30.0
  append_colon_to_layer_header: true
  footer_text: "EN center · RU left · Shift: EN top / RU top-left · Del on Nav/Sym (Bksp key)"
  svg_extra_style: |
    text.left, text.tl {
      font-size: 11px;
      fill: #555;
    }
    @media (prefers-color-scheme: dark) {
      text.left, text.tl {
        fill: #aaa;
      }
    }

parse_config:
  mark_alternate_layer_activators: true
  trans_legend:
    tap: ▽
    type: trans

  zmk_keycode_map:
    N1: { tap: "1", shifted: "!" }
    N2: { tap: "2", shifted: "@", tl: '"' }
    N3: { tap: "3", shifted: "#", tl: "№" }
    N4: { tap: "4", shifted: "$", tl: ";" }
    N5: { tap: "5", shifted: "%" }
    N6: { tap: "6", shifted: "^", tl: ":" }
    N7: { tap: "7", shifted: "&", tl: "?" }
    N8: { tap: "8", shifted: "*" }
    N9: { tap: "9", shifted: "(" }
    N0: { tap: "0", shifted: ")" }

    GRAVE: { tap: "`", shifted: "~", left: "ё", tl: "Ё" }
    MINUS: { tap: "-", shifted: "_" }
    EQUAL: { tap: "=", shifted: "+" }
    LBKT: { tap: "[", shifted: "{", left: "х", tl: "Х" }
    RBKT: { tap: "]", shifted: "}", left: "ъ", tl: "Ъ" }
    BACKSLASH: { tap: "\\", shifted: "|", tl: "/" }

    Q: { tap: "Q", left: "Й" }
    W: { tap: "W", left: "Ц" }
    E: { tap: "E", left: "У" }
    R: { tap: "R", left: "К" }
    T: { tap: "T", left: "Е" }
    Y: { tap: "Y", left: "Н" }
    U: { tap: "U", left: "Г" }
    I: { tap: "I", left: "Ш" }
    O: { tap: "O", left: "Щ" }
    P: { tap: "P", left: "З" }
    A: { tap: "A", left: "Ф" }
    S: { tap: "S", left: "Ы" }
    D: { tap: "D", left: "В" }
    F: { tap: "F", left: "А" }
    G: { tap: "G", left: "П" }
    H: { tap: "H", left: "Р" }
    J: { tap: "J", left: "О" }
    K: { tap: "K", left: "Л" }
    L: { tap: "L", left: "Д" }
    Z: { tap: "Z", left: "Я" }
    X: { tap: "X", left: "Ч" }
    C: { tap: "C", left: "С" }
    V: { tap: "V", left: "М" }
    B: { tap: "B", left: "И" }
    N: { tap: "N", left: "Т" }
    M: { tap: "M", left: "Ь" }
    SEMI: { tap: ";", shifted: ":", left: "ж", tl: "Ж" }
    SINGLE_QUOTE: { tap: "'", shifted: '"', left: "э", tl: "Э" }
    COMMA: { tap: ",", shifted: "<", left: "б", tl: "Б" }
    DOT: { tap: ".", shifted: ">", left: "ю", tl: "Ю" }
    SLASH: { tap: "/", shifted: "?", left: ".", tl: "," }

    EXCLAMATION: "!"
    AT_SIGN: "@"
    HASH: "#"
    DOLLAR: "$"
    PERCENT: "%"
    CARET: "^"
    AMPS: "&"
    ASTERISK: "*"
    LPAR: "("
    RPAR: ")"
    PLUS: "+"
    UNDERSCORE: "_"
    QUESTION: "?"
    PIPE: "|"
    COLON: ":"
    DOUBLE_QUOTES: '"'
    LESS_THAN: "<"
    GREATER_THAN: ">"
    LBRC: "{"
    RBRC: "}"
    TILDE: "~"

    ESC: "Esc"
    RETURN: "↵"
    TAB: "Tab"
    SPACE: "␣"
    BACKSPACE: "⌫"
    DEL: "Del"
    PG_UP: "PgUp"
    PG_DN: "PgDn"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    LCTRL: "Ctrl"
    RCTRL: "Ctrl"
    LALT: "Alt"
    RALT: "Alt"
    LSHFT: "⇧"
    RSHFT: "⇧"
    LGUI: "⌘"
    RGUI: "⌘"
    F1: "F1"
    F2: "F2"
    F3: "F3"
    F4: "F4"
    F5: "F5"
    F6: "F6"
    F7: "F7"
    F8: "F8"
    F9: "F9"
    F10: "F10"
    F11: "F11"
    F12: "F12"
    C_MUTE: "Mute"
    C_VOL_UP: "Vol+"
    C_VOL_DN: "Vol−"
    C_RW: "⏪"
    C_PP: "⏯"
    C_FF: "⏩"
    C_BRI_UP: "Bri+"
    C_BRI_DN: "Bri−"

  raw_binding_map:
    "&kp LC(UP)":
      tap: "Win"
    "&kp LG(LBKT)":
      tap: "Back"
    "&kp LG(RBKT)":
      tap: "Fwd"
    "&kp LG(LA(LEFT))":
      tap: "Tab◀"
    "&kp LG(LA(RIGHT))":
      tap: "Tab▶"
    "&kp LA(LEFT)":
      tap: "W◀"
    "&kp LA(RIGHT)":
      tap: "W▶"
    "&bt BT_CLR":
      tap: "BT clr"
    "&bt BT_SEL 0":
      tap: "BT 0"
    "&bt BT_SEL 1":
      tap: "BT 1"
    "&bt BT_SEL 2":
      tap: "BT 2"
    "&bt BT_SEL 3":
      tap: "BT 3"
    "&bt BT_SEL 4":
      tap: "BT 4"
