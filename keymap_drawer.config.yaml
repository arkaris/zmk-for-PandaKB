draw_config:
  n_columns: 1
  split_gap: 30.0
  append_colon_to_layer_header: true
  footer_text: "EN center · RU left · Shift: EN top / RU right · Del = Shift+Bksp"
  svg_extra_style: |
    text.left {
      font-size: 11px;
      fill: #555;
    }
    @media (prefers-color-scheme: dark) {
      text.left {
        fill: #aaa;
      }
    }

parse_config:
  mark_alternate_layer_activators: true
  zmk_combos:
    del_lshift_bspc:
      hidden: true
    del_rshift_bspc:
      hidden: true
  trans_legend:
    tap: ▽
    type: trans

  zmk_keycode_map:
    N1: { tap: "1", shifted: "!" }
    N2: { tap: "2", shifted: "@", left: "2", right: '"' }
    N3: { tap: "3", shifted: "#", left: "3", right: "№" }
    N4: { tap: "4", shifted: "$", left: "4", right: ";" }
    N5: { tap: "5", shifted: "%" }
    N6: { tap: "6", shifted: "^", left: "6", right: ":" }
    N7: { tap: "7", shifted: "&", left: "7", right: "?" }
    N8: { tap: "8", shifted: "*" }
    N9: { tap: "9", shifted: "(" }
    N0: { tap: "0", shifted: ")" }

    GRAVE: { tap: "`", shifted: "~", left: "ё", right: "Ё" }
    MINUS: { tap: "-", shifted: "_", left: "-" }
    EQUAL: { tap: "=", shifted: "+", left: "=" }
    LBKT: { tap: "[", shifted: "{", left: "х", right: "Х" }
    RBKT: { tap: "]", shifted: "}", left: "ъ", right: "Ъ" }
    BSLH: { tap: "\\", shifted: "|", left: "\\", right: "/" }

    Q: { tap: "Q", left: "Й" }
    W: { tap: "W", left: "Ц" }
    E: { tap: "E", left: "У" }
    R: { tap: "R", left: "К" }
    T: { tap: "T", left: "Е" }
    Y: { tap: "Y", left: "Н" }
    U: { tap: "U", left: "Г" }
    I: { tap: "I", left: "Ш" }
    O: { tap: "O", left: "Щ" }
    P: { tap: "P", left: "З" }
    A: { tap: "A", left: "Ф" }
    S: { tap: "S", left: "Ы" }
    D: { tap: "D", left: "В" }
    F: { tap: "F", left: "А" }
    G: { tap: "G", left: "П" }
    H: { tap: "H", left: "Р" }
    J: { tap: "J", left: "О" }
    K: { tap: "K", left: "Л" }
    L: { tap: "L", left: "Д" }
    Z: { tap: "Z", left: "Я" }
    X: { tap: "X", left: "Ч" }
    C: { tap: "C", left: "С" }
    V: { tap: "V", left: "М" }
    B: { tap: "B", left: "И" }
    N: { tap: "N", left: "Т" }
    M: { tap: "M", left: "Ь" }
    SEMI: { tap: ";", shifted: ":", left: "ж", right: "Ж" }
    SQT: { tap: "'", shifted: '"', left: "э", right: "Э" }
    COMMA: { tap: ",", shifted: "<", left: "б", right: "Б" }
    DOT: { tap: ".", shifted: ">", left: "ю", right: "Ю" }
    FSLH: { tap: "/", shifted: "?", left: ".", right: "," }

    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: "$"
    DLLR: "$"
    PERCENT: "%"
    PRCNT: "%"
    CARET: "^"
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: "("
    LPAR: "("
    RIGHT_PARENTHESIS: ")"
    RPAR: ")"
    PLUS: "+"
    UNDERSCORE: "_"
    UNDER: "_"
    SLASH: "/"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH: "\\"
    PIPE: "|"
    NON_US_BACKSLASH: "\\"
    PIPE2: "|"
    NON_US_BSLH: "|"
    COLON: ":"
    SINGLE_QUOTE: "'"
    APOSTROPHE: "'"
    APOS: "'"
    DOUBLE_QUOTES: '"'
    DQT: '"'
    LESS_THAN: "<"
    LT: "<"
    PERIOD: "."
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET: "["
    LEFT_BRACE: "{"
    LBRC: { tap: "{", left: "х", right: "Х" }
    RIGHT_BRACKET: "]"
    RIGHT_BRACE: "}"
    RBRC: { tap: "}", left: "ъ", right: "Ъ" }
    TILDE: "~"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

    ESC: "Esc"
    RET: "↵"
    RETURN: "↵"
    TAB: "Tab"
    SPACE: "␣"
    BSPC: { tap: "⌫", shifted: "Del" }
    BACKSPACE: { tap: "⌫", shifted: "Del" }
    DEL: "Del"
    DELETE: "Del"
    PG_UP: "PgUp"
    PAGE_UP: "PgUp"
    PG_DN: "PgDn"
    PAGE_DOWN: "PgDn"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    LCTRL: "Ctrl"
    LEFT_CONTROL: "Ctrl"
    RCTRL: "Ctrl"
    RIGHT_CONTROL: "Ctrl"
    LALT: "Alt"
    LEFT_ALT: "Alt"
    RALT: "Alt"
    RIGHT_ALT: "Alt"
    LSHFT: "⇧"
    LEFT_SHIFT: "⇧"
    RSHFT: "⇧"
    RIGHT_SHIFT: "⇧"
    LGUI: "⌘"
    LEFT_GUI: "⌘"
    RGUI: "⌘"
    RIGHT_GUI: "⌘"
    F1: "F1"
    F2: "F2"
    F3: "F3"
    F4: "F4"
    F5: "F5"
    F6: "F6"
    F7: "F7"
    F8: "F8"
    F9: "F9"
    F10: "F10"
    F11: "F11"
    F12: "F12"
    C_MUTE: "Mute"
    C_VOL_UP: "Vol+"
    C_VOL_DN: "Vol−"
    C_RW: "⏪"
    C_PP: "⏯"
    C_FF: "⏩"
    C_BRI_UP: "Bri+"
    C_BRI_DN: "Bri−"

  raw_binding_map:
    "&mo NUMFN":
      tap: "NumFn"
      hold: "NumFn"
    "&mo SYM":
      tap: "Sym"
      hold: "Sym"
    "&kp LG(LBKT)":
      tap: "Back"
    "&kp LG(RBKT)":
      tap: "Fwd"
    "&kp LG(LA(LEFT))":
      tap: "Tab◀"
    "&kp LG(LA(RIGHT))":
      tap: "Tab▶"
    "&kp LA(LEFT)":
      tap: "W◀"
    "&kp LA(RIGHT)":
      tap: "W▶"
    "&bt BT_CLR":
      tap: "BT clr"
    "&bt BT_SEL 0":
      tap: "BT 0"
    "&bt BT_SEL 1":
      tap: "BT 1"
    "&bt BT_SEL 2":
      tap: "BT 2"
    "&bt BT_SEL 3":
      tap: "BT 3"
    "&bt BT_SEL 4":
      tap: "BT 4"
