# interval of sending battary info to PC
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=900
# prevent contact debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# bluetooth power
CONFIG_BT_CTLR_TX_PWR_PLUS=y
# keyboard name
CONFIG_ZMK_KEYBOARD_NAME="PandaKB_Sofle"
# fix Windows battary bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# oled display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# idle state
CONFIG_ZMK_IDLE_TIMEOUT=30000
# deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# zmk studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

#rgb underboard
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
#键盘进入空闲状态时关闭RGB
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=0

# encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# disable oled vcc while deep sleep
CONFIG_ZMK_EXT_POWER=y
